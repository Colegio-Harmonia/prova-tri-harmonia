name: prova-tri

x-app-common: &app-common
  image: prova-tri:local
  build:
    context: .
    dockerfile: Dockerfile
    provenance: false
    secrets:
      - env_local
  restart: unless-stopped
  init: true
  env_file:
    - .env.local
  environment: &app-environment
    NODE_ENV: production
    DATABASE_URL: postgresql://prova_tri:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.local}@postgres:5432/prova_tri
    OMR_PYTHON_BIN: /opt/omr/bin/python
    PDFTOPPM_PATH: /usr/bin/pdftoppm
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - ${SCAN_STAGING_DIR:?Defina SCAN_STAGING_DIR em .env.local}:${SCAN_STAGING_DIR:?Defina SCAN_STAGING_DIR em .env.local}
    - ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:?Defina GOOGLE_SERVICE_ACCOUNT_KEY_PATH em .env.local}:${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:?Defina GOOGLE_SERVICE_ACCOUNT_KEY_PATH em .env.local}:ro
    - ${GOOGLE_CHAT_SERVICE_ACCOUNT_KEY_PATH:?Defina GOOGLE_CHAT_SERVICE_ACCOUNT_KEY_PATH em .env.local}:${GOOGLE_CHAT_SERVICE_ACCOUNT_KEY_PATH:?Defina GOOGLE_CHAT_SERVICE_ACCOUNT_KEY_PATH em .env.local}:ro
  stop_grace_period: 2m
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    container_name: prova-tri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prova_tri
      POSTGRES_USER: prova_tri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.local}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - prova_tri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prova_tri -d prova_tri']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    cpus: 1.5

  web:
    <<: *app-common
    container_name: prova-tri-web
    ports:
      - '3010:3010'
    command: npm run start
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS --max-time 5 http://127.0.0.1:3010/login >/dev/null || exit 1']
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    cpus: 1.5

  worker:
    <<: *app-common
    container_name: prova-tri-worker
    command: npm run worker
    mem_limit: 768m
    cpus: 1.5

  ocr-worker:
    <<: *app-common
    command: npm run worker:scan-transcription
    deploy:
      replicas: 2
    mem_limit: 768m
    cpus: 1.5

secrets:
  env_local:
    file: .env.local

volumes:
  prova_tri_postgres_data:
    driver: local
